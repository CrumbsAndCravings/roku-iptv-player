name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate BrightScript and SceneGraph
        run: npm run lint
      - name: Off-device tests
        run: npm test
      - name: Package
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: aranplus
          path: build/aranplus.zip
