<meta charset="utf-8">

<style>
/* Vertical 1080x1920 stage. Every colour, font and asset comes from the ARAN+ app:

  --card: #241C42;
  --pill: #30275A;

  --ink-3: #A195CC;
  --ink-4: #8579B0;

#app { height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding-block: 16px; padding-inline: 16px; }
#frame { position: relative; overflow: hidden; border-radius: 14px; box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(201,184,255,.12); max-width: 100%; }
#stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; overflow: hidden; background: var(--plum); }

#bar button { appearance: none; border: 0; border-radius: 4px; background: var(--pill); color: var(--ink); font: 500 15px/1 var(--display); height: 34px; padding: 0 14px; cursor: pointer; min-width: 74px; }

#bar button:focus-visible, #scrub:focus-visible { outline: 3px solid var(--lavender); outline-offset: 2px; }
#scrub { flex: 1; min-width: 0; accent-color: var(--lavender); }

.upnext .ey { position: absolute; left: 28px; top: 20px; font: 800 14px/1.2 var(--body); letter-spacing: .08em; color: var(--pink); }

/* --- feature list and outro --- */

<script>
(() => {
"use strict";
const DUR = 35;
const $ = (s, r = document) => r.querySelector(s);
const html = (el, s) => { el.insertAdjacentHTML("beforeend", s); return el.lastElementChild; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const E = {
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outBack: x => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  outQuad: x => 1 - (1 - x) * (1 - x),
  inOutSine: x => -(Math.cos(Math.PI * x) - 1) / 2,
};
// Opacity for something shown between a and b, fading in and out.
const win = (t, a, b, fin = .35, fout = .3) => E.outCubic(seg(t, a, a + fin)) * (1 - E.inCubic(seg(t, b - fout, b)));
const keyed = (keys, t, p, ease = E.inOutCubic) => {
  if (t <= keys[0].t) return keys[0][p];
  for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1];
    if (t <= b.t) return lerp(a[p], b[p], ease(seg(t, a.t, b.t)));
  }
  return keys[keys.length - 1][p];
};
const setStyle = (el, o) => { for (const k in o) { const v = String(o[k]); if (el.style[k] !== v) el.style[k] = v; } };
const setText = (el, s) => { if (el.textContent !== s) el.textContent = s; };

// The app's four-point sparkle (tools/make_images.py), as a vector so it stays sharp when big.
const SPARK_PTS = (() => { const p = []; for (let i = 0; i < 8; i++) { const a = Math.PI / 4 * i - Math.PI / 2, r = i % 2 ? 48 * .28 : 48; p.push((50 + Math.cos(a) * r).toFixed(2) + "," + (50 + Math.sin(a) * r).toFixed(2)); } return p.join(" "); })();
const sparkSVG = (color, style) => `<svg class="spark" viewBox="0 0 100 100" style="${style}"><polygon points="${SPARK_PTS}" fill="${color}"/></svg>`;
const wordmark = () => `<span class="wm"><span class="n">ARAN</span><span class="p">+</span></span>`;

/* ------------------------------------------------------------------ poster art
   Posters come from each person's provider, so the promo paints its own:
   graded to sit in the app's plum, lavender, pink and butter world. */
const PAL = {
  dusk:   { sky: ["#1b1238", "#5a2a6e", "#ff8fb8"], sun: "#ffd98a", land: ["#0f0a20", "#26173f", "#3d2559"] },
  teal:   { sky: ["#071f2b", "#11475a", "#ff9a66"], sun: "#ffe2a8", land: ["#04121a", "#0a2a35", "#15414e"] },
  ember:  { sky: ["#1a0b14", "#5c1a2a", "#ff6a4d"], sun: "#ffc178", land: ["#0e060c", "#2a0e18", "#45162a"] },
  arctic: { sky: ["#0a1430", "#24427a", "#9fd6ff"], sun: "#f2f7ff", land: ["#060c1e", "#13254a", "#2a4677"] },
  gold:   { sky: ["#24120a", "#7a3e14", "#ffcf73"], sun: "#fff1c2", land: ["#140a05", "#3a1d0b", "#5c3212"] },
  jade:   { sky: ["#071a17", "#11493d", "#7fe3b8"], sun: "#e8fff4", land: ["#04100e", "#0b2b25", "#15443a"] },
  violet: { sky: ["#120a2e", "#3b2580", "#c9b8ff"], sun: "#ffffff", land: ["#0b0620", "#22164f", "#38277a"] },
  rose:   { sky: ["#200a1e", "#6e1f52", "#ff9ecf"], sun: "#ffe0ef", land: ["#12050f", "#36102c", "#5a1b49"] },
};
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
let artId = 0;
const f1 = n => n.toFixed(1);
function art(spec, w, h) {
  const P = PAL[spec.pal], r = rng(spec.seed), id = "a" + (artId++), m = Math.min(w, h);
  const defs = [], b = [];
  defs.push(`<linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${P.sky[0]}"/><stop offset=".58" stop-color="${P.sky[1]}"/><stop offset=".9" stop-color="${P.sky[2]}"/></linearGradient>`);
  defs.push(`<radialGradient id="${id}g"><stop offset="0" stop-color="${P.sun}" stop-opacity=".75"/><stop offset=".35" stop-color="${P.sky[2]}" stop-opacity=".35"/><stop offset="1" stop-color="${P.sky[2]}" stop-opacity="0"/></radialGradient>`);
  defs.push(`<linearGradient id="${id}v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05030c" stop-opacity=".25"/><stop offset=".25" stop-color="#05030c" stop-opacity="0"/><stop offset=".62" stop-color="#05030c" stop-opacity="0"/><stop offset="1" stop-color="#05030c" stop-opacity=".62"/></linearGradient>`);
  const sky = () => b.push(`<rect width="${w}" height="${h}" fill="url(#${id}s)"/>`);
  const sun = (x, y, R) => b.push(`<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(R * 2.8)}" fill="url(#${id}g)"/><circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(R)}" fill="${P.sun}"/>`);
  const stars = (n, maxY) => { for (let i = 0; i < n; i++) b.push(`<circle cx="${f1(r() * w)}" cy="${f1(r() * maxY)}" r="${(.25 + r() * .55) * m / 120}" fill="#fff" opacity="${(.25 + r() * .7).toFixed(2)}"/>`); };
  const ridge = (base, amp, n) => { const pts = []; for (let i = 0; i <= n; i++) { const up = i % 2 === 0; pts.push([w * i / n, base - (up ? amp * (.35 + r() * .65) : -amp * .25 * r())]); } return pts; };
  const ridgeD = pts => `M0,${h} L` + pts.map(p => f1(p[0]) + "," + f1(p[1])).join(" L") + ` L${w},${h} Z`;
  const ridgeY = (pts, x) => { for (let i = 0; i < pts.length - 1; i++) if (x <= pts[i + 1][0]) { const k = (x - pts[i][0]) / (pts[i + 1][0] - pts[i][0]); return lerp(pts[i][1], pts[i + 1][1], k); } return pts[pts.length - 1][1]; };
  const figure = (x, foot, s, col) => b.push(`<circle cx="${f1(x)}" cy="${f1(foot - s * .9)}" r="${f1(s * .11)}" fill="${col}"/><path d="M${f1(x - s * .15)},${f1(foot - s * .72)} Q${f1(x)},${f1(foot - s * .84)} ${f1(x + s * .15)},${f1(foot - s * .72)} L${f1(x + s * .1)},${f1(foot)} L${f1(x - s * .1)},${f1(foot)} Z" fill="${col}"/>`);
  const land = (y, col) => b.push(`<rect y="${f1(y)}" width="${w}" height="${f1(h - y)}" fill="${col}"/>`);
  const wide = w > h;

  if (spec.kind === "peaks") {
    sky(); stars(14, h * .35);
    sun(w * (.35 + r() * .3), h * .5, m * .17);
    const layers = [[h * .6, h * .14, P.land[2]], [h * .72, h * .1, P.land[1]], [h * .86, h * .06, P.land[0]]];
    let front;
    layers.forEach(([base, amp, col], i) => { const pts = ridge(base, amp, wide ? 14 : 8); b.push(`<path d="${ridgeD(pts)}" fill="${col}"/>`); if (i < 2) b.push(`<rect y="${f1(base - amp * .2)}" width="${w}" height="${f1(amp)}" fill="${P.sky[2]}" opacity=".06"/>`); front = pts; });
    const fx = w * (.58 + r() * .2); figure(fx, ridgeY(front, fx) + 1, h * .09, P.land[0]);
  } else if (spec.kind === "city") {
    sky(); stars(10, h * .3);
    sun(w * (spec.sunX || .72), h * (spec.sunY || .2), m * .085);
    for (let x = -2; x < w;) { const bw = w * (.07 + r() * .1) * (wide ? .55 : 1), bh = h * (.18 + r() * .22); b.push(`<rect x="${f1(x)}" y="${f1(h * .8 - bh)}" width="${f1(bw)}" height="${f1(bh + h)}" fill="${P.land[2]}"/>`); x += bw + .6; }
    b.push(`<rect y="${f1(h * .55)}" width="${w}" height="${f1(h * .3)}" fill="${P.sky[2]}" opacity=".08"/>`);
    for (let x = -3; x < w;) {
      const bw = w * (.1 + r() * .12) * (wide ? .5 : 1), bh = h * (.28 + r() * .3), top = h * .9 - bh;
      b.push(`<rect x="${f1(x)}" y="${f1(top)}" width="${f1(bw)}" height="${f1(bh + h)}" fill="${P.land[0]}"/>`);
      const ws = m * .028;
      for (let yy = top + ws; yy < h * .88; yy += ws * 1.7) for (let xx = x + ws * .6; xx < x + bw - ws; xx += ws * 1.5) if (r() < (spec.lit || .3)) b.push(`<rect x="${f1(xx)}" y="${f1(yy)}" width="${f1(ws * .7)}" height="${f1(ws)}" fill="${P.sun}" opacity="${(.25 + r() * .6).toFixed(2)}"/>`);
      x += bw + .8;
    }
    land(h * .9, P.land[0]);
  } else if (spec.kind === "sea") {
    sky(); stars(8, h * .25);
    const hz = h * .6, R = m * .24, cx = w * (.42 + r() * .16);
    sun(cx, hz, R);
    defs.push(`<linearGradient id="${id}w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${P.land[2]}"/><stop offset="1" stop-color="${P.land[0]}"/></linearGradient>`);
    b.push(`<rect y="${f1(hz)}" width="${w}" height="${f1(h - hz)}" fill="url(#${id}w)"/>`);
    for (let i = 0; i < 16; i++) { const y = hz + 2 + i * (h - hz) / 16, ww = R * (1.5 - i * .05) * (.55 + r() * .45); b.push(`<rect x="${f1(cx - ww / 2 + (r() - .5) * 6)}" y="${f1(y)}" width="${f1(ww)}" height="${f1(m * .009 + .5)}" rx=".5" fill="${P.sun}" opacity="${(.6 - i * .033).toFixed(2)}"/>`); }
    const bx = w * .26, by = hz + (h - hz) * .32, s = m * .1;
    b.push(`<path d="M${f1(bx - s * .5)},${f1(by)} L${f1(bx + s * .5)},${f1(by)} L${f1(bx + s * .36)},${f1(by + s * .16)} L${f1(bx - s * .36)},${f1(by + s * .16)} Z" fill="${P.land[0]}"/><path d="M${f1(bx)},${f1(by - s * .02)} L${f1(bx)},${f1(by - s * .7)} L${f1(bx + s * .32)},${f1(by - s * .06)} Z" fill="${P.land[0]}"/>`);
  } else if (spec.kind === "profile") {
    defs.push(`<linearGradient id="${id}d" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${P.sky[1]}"/><stop offset="1" stop-color="${P.land[0]}"/></linearGradient>`);
    defs.push(`<linearGradient id="${id}c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${P.sun}"/><stop offset="1" stop-color="${P.sky[2]}"/></linearGradient>`);
    b.push(`<rect width="${w}" height="${h}" fill="url(#${id}d)"/>`);
    const cx = wide ? w * .66 : w * .5, cy = h * .4, R = m * .37;
    b.push(`<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(R * 1.9)}" fill="url(#${id}g)" opacity=".7"/><circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(R)}" fill="url(#${id}c)"/>`);
    for (let i = 0; i < 5; i++) { const y = cy + R * (.1 + i * .17); b.push(`<rect x="${f1(cx - R)}" y="${f1(y)}" width="${f1(R * 2)}" height="${f1(R * (.02 + i * .022))}" fill="${P.sky[1]}" opacity=".85"/>`); }
    const hx = cx + (wide ? 0 : (r() - .5) * w * .1), hy = h * .5, hs = m * .16;
    b.push(`<ellipse cx="${f1(hx)}" cy="${f1(hy)}" rx="${f1(hs * .86)}" ry="${f1(hs * 1.06)}" fill="${P.land[0]}"/><rect x="${f1(hx - hs * .38)}" y="${f1(hy + hs * .6)}" width="${f1(hs * .76)}" height="${f1(hs * 1.2)}" fill="${P.land[0]}"/><path d="M${f1(hx - hs * 2.7)},${h} C${f1(hx - hs * 2.4)},${f1(hy + hs * 1.6)} ${f1(hx - hs * 1.2)},${f1(hy + hs * 1.4)} ${f1(hx)},${f1(hy + hs * 1.4)} C${f1(hx + hs * 1.2)},${f1(hy + hs * 1.4)} ${f1(hx + hs * 2.4)},${f1(hy + hs * 1.6)} ${f1(hx + hs * 2.7)},${h} Z" fill="${P.land[0]}"/>`);
  } else if (spec.kind === "planet") {
    defs.push(`<linearGradient id="${id}d" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${P.land[0]}"/><stop offset="1" stop-color="${P.sky[1]}"/></linearGradient>`);
    defs.push(`<radialGradient id="${id}p" cx=".34" cy=".3" r=".85"><stop offset="0" stop-color="${P.sun}"/><stop offset=".35" stop-color="${P.sky[2]}"/><stop offset=".75" stop-color="${P.sky[1]}"/><stop offset="1" stop-color="${P.land[0]}"/></radialGradient>`);
    b.push(`<rect width="${w}" height="${h}" fill="url(#${id}d)"/>`);
    stars(wide ? 70 : 34, h * .8);
    const cx = w * (wide ? .64 : .6), cy = h * (wide ? .38 : .34), R = m * (wide ? .3 : .3);
    b.push(`<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(R * 2.2)}" fill="url(#${id}g)" opacity=".55"/><circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(R)}" fill="url(#${id}p)"/>`);
    b.push(`<ellipse cx="${f1(cx)}" cy="${f1(cy)}" rx="${f1(R * 1.8)}" ry="${f1(R * .3)}" fill="none" stroke="${P.sun}" stroke-opacity=".6" stroke-width="${f1(m * .012)}" transform="rotate(-16 ${f1(cx)} ${f1(cy)})"/>`);
    const pts = ridge(h * .84, h * .07, wide ? 12 : 7);
    b.push(`<path d="${ridgeD(pts)}" fill="${P.land[0]}"/>`);
    const fx = w * (wide ? .3 : .34); figure(fx, ridgeY(pts, fx) + 1, h * (wide ? .14 : .1), "#05030c");
  } else if (spec.kind === "forest") {
    sky(); stars(12, h * .3);
    sun(w * (.25 + r() * .5), h * .24, m * .08);
    [[h * .6, h * .18, P.land[2]], [h * .74, h * .25, P.land[1]], [h * .92, h * .34, P.land[0]]].forEach(([base, th, col]) => {
      let d = "";
      for (let x = -m * .1; x < w + m * .1;) { const hh = th * (.55 + r() * .45), tw = hh * .42; d += `M${f1(x)},${f1(base)} L${f1(x + tw / 2)},${f1(base - hh)} L${f1(x + tw)},${f1(base)} Z `; x += tw * (.45 + r() * .4); }
      b.push(`<path d="${d}" fill="${col}"/><rect y="${f1(base - 1)}" width="${w}" height="${f1(h - base + 1)}" fill="${col}"/>`);
      b.push(`<rect y="${f1(base - th * .25)}" width="${w}" height="${f1(th * .5)}" fill="${P.sky[2]}" opacity=".07"/>`);
    });
  } else if (spec.kind === "road") {
    sky(); stars(10, h * .3);
    const hz = h * .56, vx = w / 2;
    sun(vx, hz, m * .2);
    land(hz, P.land[0]);
    let g = "";
    for (let i = -6; i <= 6; i++) g += `M${f1(vx)},${f1(hz)} L${f1(vx + i * w * .2)},${h} `;
    for (let k = 1; k < 9; k++) { const y = hz + (h - hz) * Math.pow(k / 9, 2); g += `M0,${f1(y)} L${w},${f1(y)} `; }
    b.push(`<path d="${g}" stroke="${P.sky[2]}" stroke-opacity=".38" stroke-width="${f1(m * .006 + .2)}" fill="none"/>`);
    b.push(`<path d="M${f1(vx - w * .015)},${f1(hz)} L${f1(vx + w * .015)},${f1(hz)} L${f1(vx + w * .3)},${h} L${f1(vx - w * .3)},${h} Z" fill="${P.land[1]}"/>`);
    for (let k = 0; k < 6; k++) { const a = Math.pow(k / 6, 1.7), c = Math.pow((k + .5) / 6, 1.7); const y1 = hz + (h - hz) * a, y2 = hz + (h - hz) * c; b.push(`<path d="M${f1(vx - .3 - a * 2)},${f1(y1)} L${f1(vx + .3 + a * 2)},${f1(y1)} L${f1(vx + .3 + c * 2)},${f1(y2)} L${f1(vx - .3 - c * 2)},${f1(y2)} Z" fill="${P.sun}" opacity=".85"/>`); }
    const pts = ridge(hz, h * .05, 10);
    b.push(`<path d="${ridgeD(pts).replace(`L${w},${h}`, `L${w},${f1(hz)}`).replace(`M0,${h}`, `M0,${f1(hz)}`)}" fill="${P.land[1]}"/>`);
  } else {
    // streaks: beams of light and one backlit figure
    defs.push(`<linearGradient id="${id}d" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${P.sky[0]}"/><stop offset="1" stop-color="${P.land[0]}"/></linearGradient>`);
    defs.push(`<linearGradient id="${id}b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${P.sky[2]}" stop-opacity=".6"/><stop offset="1" stop-color="${P.sky[2]}" stop-opacity="0"/></linearGradient>`);
    b.push(`<rect width="${w}" height="${h}" fill="url(#${id}d)"/>`);
    const ox = w * (.3 + r() * .4);
    for (let i = 0; i < 6; i++) { const a = -w * .3 + r() * w * 1.6, sp = w * (.05 + r() * .08); b.push(`<path d="M${f1(ox - 2)},${f1(-h * .05)} L${f1(ox + 2)},${f1(-h * .05)} L${f1(a + sp)},${h} L${f1(a - sp)},${h} Z" fill="url(#${id}b)" opacity="${(.35 + r() * .5).toFixed(2)}"/>`); }
    b.push(`<ellipse cx="${f1(w * .5)}" cy="${f1(h * .97)}" rx="${f1(w * .35)}" ry="${f1(h * .05)}" fill="${P.sky[2]}" opacity=".35"/>`);
    figure(w * .5, h * .97, h * .42, "#05030c");
  }
  b.push(`<rect width="${w}" height="${h}" fill="url(#${id}v)"/>`);
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs>${defs.join("")}</defs>${b.join("")}</svg>`;
}

function posterItem(parent, x, item, opts = {}) {
  const el = html(parent, `<div class="pi" style="left:${x}px"><div class="card"><div class="ring"></div><div class="base"></div></div></div>`);
  const card = el.firstElementChild, base = card.children[1];

    html(card, `<div class="name">${item.name}</div>`);
    if (item.cap) html(card, `<div class="cap2">${item.cap}</div>`);

    base.innerHTML = art(item.art, 120, 180);

    if (item.p) html(card, `<div class="track"><div class="fillbar" style="width:${item.p * 120}px"></div></div>`);
  }
  return { el, card, ring: card.firstElementChild, fill: card.querySelector(".fillbar"), p: item.p || 0 };

];
// Focus changes: [time, index]. Each item eases in or out over 0.2 s, like RowList.
const focusAmt = (events, t, key) => {
  let cur = -1;
  for (let i = 0; i < events.length; i++) if (t >= events[i][0]) cur = i;
  if (cur < 0) return 0;
  const k = seg(t, events[cur][0], events[cur][0] + .2), is = events[cur][1] === key;
  const was = cur > 0 && events[cur - 1][1] === key;
  if (is && was) return 1;
  if (is) return E.outCubic(k);
  if (was) return 1 - E.outCubic(k);
  return 0;
};
const current = (events, t) => { let c = null; for (const e of events) if (t >= e[0]) c = e; return c; };

const HOME_FOCUS = [[0, "0:0"], [7.1, "0:1"], [8.75, "0:2"], [12.0, "0:3"], [13.25, "1:3"], [14.55, "nav"]];
const HERO_EVENTS = [[-1, 0], [7.1, 1], [8.75, 2]];
const TAB_EVENTS = [[0, 0, false], [14.55, 0, true], [14.95, 1, true], [15.2, 2, true], [15.45, 3, true]];
const CAT_FOCUS = [[16.0, "0:0"], [16.7, "0:1"], [17.4, "1:1"], [18.1, "2:1"], [18.8, "3:1"]];
const TYPED = [[19.85, "c"], [20.2, "o"], [20.55, "m"], [20.9, "e"], [21.25, "d"], [21.6, "y"]];
const RES_FOCUS = [[22.75, "0:0"], [23.2, "0:1"]];
const FEAT_FOCUS = [[29.1, 0], [29.5, 1], [29.9, 2], [30.3, 3], [30.7, 4], [31.1, 5]];

const tabGeom = () => tabEls.map(el => [el.offsetLeft + 232, el.offsetWidth]);
let TABG = null, OTABG = null;
const fmt = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

function render(t) {
  t = clamp(t, 0, DUR);
  if (!TABG) TABG = tabGeom();
  if (!OTABG) OTABG = oTabEls.map(el => [el.offsetLeft, el.offsetWidth]);

  // Stage: a grey "before" world that blooms into the plum night.
  const bloom = E.inOutCubic(seg(t, 2.75, 3.7));
  setStyle($("#neutralBg"), { opacity: 1 - bloom });
  const drift = Math.sin(t * .35);
  setStyle($("#sglowA"), { opacity: lerp(.05, .24, bloom), transform: `translate(${drift * 30}px, ${Math.cos(t * .3) * 24}px)` });
  setStyle($("#sglowB"), { opacity: lerp(.03, .17, bloom), transform: `translate(${-drift * 26}px, ${Math.sin(t * .27) * 30}px)` });

  // Camera and TV.
  const s = keyed(CAM, t, "s"), cx = keyed(CAM, t, "cx"), cy = keyed(CAM, t, "cy"), sy = keyed(CAM, t, "sy");
  const tvIn = E.outCubic(seg(t, -.4, .5)), tvOut = E.inCubic(seg(t, 28.0, 28.55));
  setStyle($("#tvCam"), { transform: `translate(${540 - cx * s}px, ${sy - cy * s + (1 - tvIn) * 60 + tvOut * 40}px) scale(${s})`, opacity: tvIn * (1 - tvOut) });
  const bez = 1 - E.inOutCubic(seg(t, 10.65, 11.25)) + E.inOutCubic(seg(t, 23.6, 24.15));
  setStyle($("#bezel"), { opacity: bez });
  setStyle($("#stand"), { opacity: bez });
  setStyle($("#gloss"), { opacity: bez });
  setStyle($("#iglowA"), { opacity: .16 * bez });
  setStyle($("#iglowB"), { opacity: .10 * bez });
  setStyle($("#bezel"), { filter: `saturate(${lerp(0, 1, bloom)})` });

  // Scrims keep captions clear when the camera is close.
  setStyle($("#scrimTop"), { opacity: clamp((820 - (sy - cy * s)) / 80) });
  setStyle($("#scrimFoot"), { opacity: .9 * (1 - bez) });
  const bottom = sy + (720 - cy) * s;
  setStyle($("#scrimBot"), { top: (bottom - 130) + "px", background: `linear-gradient(180deg, rgba(21,16,40,0) 0, var(--plum) 130px, var(--plum) 100%)`, opacity: 1 - bez });

  // Before/after swap inside the TV.
  const wipe = E.inOutCubic(seg(t, 2.85, 3.55));
  setStyle($("#aran"), { clipPath: wipe >= 1 ? "none" : `circle(${wipe * 760}px at 50% 50%)` });
  setStyle($("#dull"), { visibility: wipe >= 1 ? "hidden" : "visible", filter: `brightness(${1 - seg(t, 2.4, 2.9) * .35})` });
  setStyle(dullList, { transform: `translateY(${-Math.max(0, t) * 18}px)` });
  const fl = Math.sin(Math.PI * seg(t, 2.8, 3.6));
  setStyle($("#flash"), { background: `radial-gradient(circle at 50% 50%, rgba(226,216,255,${.55 * fl}) 0, rgba(201,184,255,${.25 * fl}) 30%, rgba(201,184,255,0) 60%)` });
  const bk = seg(t, 2.7, 3.55);
  setStyle(burst, { left: "540px", top: (sy) + "px", opacity: Math.sin(Math.PI * bk), transform: `scale(${E.outCubic(bk) * 1.5}) rotate(${bk * 90}deg)` });

  // Hook question.
  hookWords.forEach((w, i) => {
    const a = E.outCubic(seg(t, -.25 + i * .12, .2 + i * .12));
    const out = E.inCubic(seg(t, 2.6, 2.95));
    let tr = `translateY(${(1 - a) * 34 - out * 30}px)`;
    if (i === 0) tr += ` rotate(${E.outBack(seg(t, 1.5, 2.1)) * 7}deg)`;
    setStyle(w, { opacity: a * (1 - out), transform: tr });
  });

  // Brand reveal.
  const bIn = seg(t, 3.15, 3.8), bOut = E.inCubic(seg(t, 5.65, 6.0));
  setStyle(brandMark, { opacity: E.outCubic(bIn) * (1 - bOut), transform: `scale(${lerp(.72, 1, E.outBack(bIn)) - bOut * .05}) translateY(${-bOut * 30}px)` });
  brandSparks.forEach((sp, i) => {
    const k = seg(t, 3.5 + i * .14, 3.95 + i * .14);
    const tw = 1 + Math.sin(t * 3 + i * 2) * .08;
    setStyle(sp, { transform: `scale(${E.outBack(k) * tw}) rotate(${(1 - k) * -60}deg)`, opacity: k > 0 ? 1 : 0 });
  });
  const tagIn = E.outCubic(seg(t, 3.7, 4.15));
  setStyle($("#brandTag"), { opacity: tagIn * (1 - bOut), transform: `translateY(${(1 - tagIn) * 24 - bOut * 30}px)` });

  // Scene captions.
  CAPS.forEach(c => {
    const kids = c.el.children;
    let any = false;
    for (let i = 0; i < kids.length; i++) {
      const a = E.outCubic(seg(t, c.a + i * .08, c.a + i * .08 + .45)), o = E.inCubic(seg(t, c.b - .3, c.b));
      if (a * (1 - o) > 0) any = true;
      setStyle(kids[i], { opacity: a * (1 - o), transform: `translateY(${(1 - a) * 34 - o * 26}px)` });
    }
    setStyle(c.el, { visibility: any ? "visible" : "hidden" });
  });

  // Which app screen is on: each fades and floats in, like the app.
  const scr = (el, a, b) => { const i = E.outCubic(seg(t, a, a + .32)), o = seg(t, b, b + .2); setStyle(el, { opacity: i * (1 - o), transform: `translateY(${(1 - i) * 14}px)`, visibility: i * (1 - o) > 0 ? "visible" : "hidden" }); };
  scr(home, -1, 15.75);
  scr($("#cats"), 15.8, 19.05);
  scr(search, 19.1, 23.75);
  scr(player, 23.8, 99);

  renderHome(t);
  renderCats(t);
  renderSearch(t);
  renderPlayer(t);
  renderFeats(t);
  renderOutro(t);

  setStyle($("#grain"), { backgroundPosition: `${Math.floor(t * 24) * 53 % 240}px ${Math.floor(t * 24) * 97 % 240}px` });
  setStyle($("#fine"), { opacity: .85 * E.outCubic(seg(t, 3.6, 4.2)) });
}

function renderHome(t) {
  if (t > 15.9) return;
  // Hero for the focused Continue Watching title: floats up as it changes.
  const he = current(HERO_EVENTS, t), idx = he[1], c = CW[idx];
  setText(hero.children[0], c.title); setText(hero.children[1], c.meta); setText(hero.children[2], c.plot);
  const hk = E.outCubic(seg(t, he[0], he[0] + .35));
  setStyle(hero, { opacity: hk, transform: `translateY(${(1 - hk) * 14}px)` });
  bdEls.forEach((el, i) => {
    const onAt = HERO_EVENTS.find(e => e[1] === i)[0];
    const next = HERO_EVENTS.find(e => e[0] > onAt);
    const fin = i === 0 ? 1 : E.outQuad(seg(t, onAt + .25, onAt + .75));
    const gone = next && t > next[0] + .8 ? 0 : 1;
    const kb = 1.04 + .04 * seg(t, onAt, onAt + 6);
    setStyle(el, { opacity: fin * gone, zIndex: i, transform: `scale(${kb})` });
  });
  // Feathered backdrop edges only show once the TV frame is gone.
  const bez = 1 - E.inOutCubic(seg(t, 10.65, 11.25));
  const f = (1 - bez) * 120;
  setStyle(backdrops, { webkitMaskImage: f > 0 ? `linear-gradient(to left, transparent 0, #000 ${f}px), linear-gradient(to bottom, transparent 0, #000 ${f}px)` : "none", webkitMaskComposite: "source-in", maskComposite: "intersect" });

  // Tab bar.
  const te = current(TAB_EVENTS, t), prev = TAB_EVENTS[Math.max(0, TAB_EVENTS.indexOf(te) - 1)];
  const k = E.outCubic(seg(t, te[0], te[0] + .22));
  const [x0, w0] = TABG[prev[1]], [x1, w1] = TABG[te[1]];
  setStyle(tabHL, { left: lerp(x0, x1, k) + "px", width: lerp(w0, w1, k) + "px", background: te[2] ? "var(--lavender)" : "var(--pill)", transform: te[2] ? "scale(1.06)" : "none" });
  const lit = k < .5 ? prev[1] : te[1];
  tabEls.forEach((el, i) => setStyle(el, { color: te[2] && i === lit ? "var(--plum)" : i === 0 ? "var(--ink)" : "var(--ink-3)" }));

  // Rows: Down moves the next row to the top.
  const down = E.outCubic(seg(t, 13.25, 13.55));
  setStyle(rowlist, { transform: `translateY(${-226 * down}px)` });
  homeRows.forEach((row, ri) => row.forEach((p, i) => {
    const a = focusAmt(HOME_FOCUS, t, ri + ":" + i);
    setStyle(p.card, { transform: `scale(${1 + .06 * a})` });
    setStyle(p.ring, { opacity: a });
    if (p.fill && ri === 0) setStyle(p.fill, { width: (p.p * 120 * (t < 10.6 ? 1 : E.outCubic(seg(t, 11.0 + i * .06, 11.7 + i * .06)))) + "px" });
  }));
}

function renderCats(t) {
  if (t < 15.6 || t > 19.4) return;
  catTiles.forEach((row, ri) => row.forEach((tile, i) => {
    const a = focusAmt(CAT_FOCUS, t, ri + ":" + i);
    setStyle(tile.card, { transform: `scale(${1 + .05 * a})` });
    setStyle(tile.ring, { opacity: a });
    setStyle(tile.base, { background: a > .5 ? "var(--pill-on)" : "var(--pill)" });
  }));
}

function renderSearch(t) {
  if (t < 18.9 || t > 24.2) return;
  let q = "", last = null;
  for (const e of TYPED) if (t >= e[0]) { q += e[1]; last = e; }
  const caret = Math.floor(t * 2.2) % 2 === 0 && t < 22.75 ? '<span class="caret"></span>' : "";
  const box = (q ? q : '<span class="hint">Movies and series</span>') + caret;
  if (kbBox.innerHTML !== box) kbBox.innerHTML = box;
  // The key highlight glides to each letter just before it is pressed.
  let from = "a", to = "a", mt = 0;
  for (let i = 0; i < TYPED.length; i++) if (t >= TYPED[i][0] - .2) { from = i ? TYPED[i - 1][1] : "a"; to = TYPED[i][1]; mt = TYPED[i][0] - .2; }
  const mk = E.outCubic(seg(t, mt, mt + .14));
  const [fx, fy] = keyPos[from], [tx, ty] = keyPos[to];
  const press = last && t - last[0] < .14 ? .9 : 1;
  const kbFocused = t < 22.75;
  setStyle(kFocus, { left: lerp(fx, tx, mk) + "px", top: lerp(fy, ty, mk) + "px", transform: `scale(${press})`, background: kbFocused ? "var(--lavender)" : "var(--pill-on)" });
  kbPad.querySelectorAll(".key").forEach(k => setStyle(k, { color: kbFocused && k.textContent === to && mk > .5 ? "var(--plum)" : "var(--key)" }));
  // Results fill in after the debounce.
  resRows.forEach((r, ri) => {
    const a = E.outCubic(seg(t, 20.9 + ri * .1, 21.25 + ri * .1));
    setStyle(r.row, { opacity: a, transform: `translateY(${(1 - a) * 16}px)` });
    r.items.forEach((p, i) => { const f = focusAmt(RES_FOCUS, t, ri + ":" + i); setStyle(p.card, { transform: `scale(${1 + .06 * f})` }); setStyle(p.ring, { opacity: f }); });
  });
}

function renderPlayer(t) {
  if (t < 23.6) return;
  const kb = 1 + .08 * seg(t, 23.6, 28.6);
  setStyle(video, { transform: `scale(${kb}) translateX(${-seg(t, 23.6, 28.6) * 16}px)` });
  const cIn = E.outCubic(seg(t, 24.1, 24.4)), cOut = seg(t, 25.75, 26.05);
  setStyle(controls, { opacity: cIn * (1 - cOut) });
  const dur = 2532, pos = 2290 + (t - 23.8);
  setText(elapsedEl, fmt(pos)); setText(remainEl, "-" + fmt(dur - pos));
  const w = 896 * pos / dur;
  setStyle(barFill, { width: w + "px" }); setStyle(knob, { left: (228 + w - 9) + "px" });
  const u = E.outCubic(seg(t, 25.95, 26.35));
  setStyle(upnext, { opacity: u, transform: `translateX(${(1 - u) * 28}px)` });
  const left = Math.max(1, 8 - Math.floor(Math.max(0, t - 26.0)));
  setText(upHint, `Starts in ${left}   ·   OK to play now`);
}

function renderFeats(t) {
  const on = t > 28.1 && t < 32;
  setStyle(feats, { visibility: on ? "visible" : "hidden" });
  if (!on) return;
  const out = E.inCubic(seg(t, 31.45, 31.8));
  [...featCap.children].forEach((k, i) => { const a = E.outCubic(seg(t, 28.25 + i * .08, 28.7 + i * .08)); setStyle(k, { opacity: a * (1 - out), transform: `translateY(${(1 - a) * 34 - out * 26}px)` }); });
  featEls.forEach((el, i) => {
    const a = E.outCubic(seg(t, 28.5 + i * .09, 28.95 + i * .09));
    const f = focusAmt(FEAT_FOCUS, t, i);
    setStyle(el, { opacity: a * (1 - out), transform: `translateX(${(1 - a) * -60}px) scale(${1 + .06 * f})`, background: f > .5 ? "var(--lavender)" : "rgba(48,39,90,.85)", color: f > .5 ? "var(--plum)" : "var(--key)" });
  });
}

function renderOutro(t) {
  const on = t > 31.6;
  setStyle(outro, { visibility: on ? "visible" : "hidden" });
  if (!on) return;
  const m = seg(t, 31.75, 32.4);
  setStyle(oMark.firstElementChild, { opacity: E.outCubic(m), transform: `scale(${lerp(.7, 1, E.outBack(m))})` });
  oSparks.forEach((sp, i) => { const k = seg(t, 32.1 + i * .14, 32.55 + i * .14); setStyle(sp, { transform: `scale(${E.outBack(k) * (1 + Math.sin(t * 3 + i * 2) * .08)}) rotate(${(1 - k) * -60}deg)`, opacity: k > 0 ? 1 : 0 }); });
  const a1 = E.outCubic(seg(t, 32.35, 32.8)), a2 = E.outCubic(seg(t, 32.6, 33.05)), a3 = E.outCubic(seg(t, 32.85, 33.3));
  setStyle(oTag, { opacity: a1, transform: `translateY(${(1 - a1) * 26}px)` });
  setStyle(oTabs, { opacity: a2, transform: `translateY(${(1 - a2) * 26}px)`, left: ((1080 - oTabs.offsetWidth) / 2) + "px" });
  setStyle(oSub, { opacity: a3, transform: `translateY(${(1 - a3) * 26}px)` });
  const steps = [[33.2, 0], [33.55, 1], [33.9, 2], [34.25, 3], [34.6, 4]];
  let cur = 0, prev = 0, st = 0;
  steps.forEach((e, i) => { if (t >= e[0]) { cur = e[1]; prev = i ? steps[i - 1][1] : 0; st = e[0]; } });
  const k = E.outCubic(seg(t, st, st + .22));
  const [x0, w0] = OTABG[prev], [x1, w1] = OTABG[cur];
  setStyle(oHL, { left: lerp(x0, x1, k) + "px", width: lerp(w0, w1, k) + "px" });
  const lit = k < .5 ? prev : cur;
  oTabEls.forEach((el, i) => setStyle(el, { color: i === lit ? "var(--plum)" : "var(--ink-3)" }));
}

/* ------------------------------------------------------------------ playback */
const isRender = /[?&]render\b/.test(location.search);
if (isRender) document.documentElement.classList.add("render");
const frame = $("#frame"), stage = $("#stage");
function fit() {
  let sc = 1;
  if (!isRender) {
    const bar = $("#bar").offsetHeight + 14;
    const availW = Math.max(160, document.documentElement.clientWidth - 32);
    const availH = Math.max(280, window.innerHeight - 32 - bar);
    sc = Math.min(availW / 1080, availH / 1920);
  }
  frame.style.width = 1080 * sc + "px"; frame.style.height = 1920 * sc + "px";
  stage.style.transform = `scale(${sc})`;
}
window.addEventListener("resize", fit);

let playing = !isRender, t0 = 0, startAt = 0, now = 0;
const playBtn = $("#playBtn"), scrub = $("#scrub"), clock = $("#clock");
const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function show(t) { now = t; render(t); scrub.value = t.toFixed(2); clock.textContent = fmt(t); }
function loop(ts) {
  if (playing) show(Math.max(0, (ts - startAt) / 1000 + t0) % DUR);
  requestAnimationFrame(loop);
}
function setPlaying(p) { playing = p; t0 = now; startAt = performance.now(); playBtn.textContent = p ? "Pause" : "Play"; }
playBtn.addEventListener("click", () => setPlaying(!playing));
scrub.addEventListener("input", () => { show(parseFloat(scrub.value)); t0 = now; startAt = performance.now(); });

window.__seek = t => { render(t); return true; };
window.__duration = DUR;
const preload = ["glow.png", "sparkle.png", "icon_pause.png", "fade_left.png", "fade_bottom.png", "fade_top.png"].map(n => { const i = new Image(); i.src = "../src/images/" + n; return i.decode().catch(() => {}); });
const nextFrame = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
Promise.all([document.fonts.ready, ...preload]).then(async () => {
  fit(); TABG = null; OTABG = null;
  if (isRender) {
    // Show every scene once so masks and fonts are decoded before frames are captured.
    for (const w of [1, 4.5, 8, 12, 15, 17, 21, 23, 26, 27.5, 30, 34]) { render(w); await nextFrame(); }
    render(0); await nextFrame();
    window.__ready = true;
    return;
  }
  window.__ready = true;
  if (reduce) { setPlaying(false); show(4.6); }
  else { setPlaying(true); show(0); }
  requestAnimationFrame(loop);
});
fit();
render(0);
})();
</script>
